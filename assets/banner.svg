<svg width="1500" height="360" viewBox="0 0 1500 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Banner: Rahul Sahu, Electrical and Electronics Engineer, blueprint-style circuit and torii gate motif">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#16324a" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1929"/>
      <stop offset="100%" stop-color="#0F2A44"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1500" height="360" fill="url(#bg)"/>
  <rect width="1500" height="360" fill="url(#grid)"/>

  <!-- circuit trace, left side -->
  <g stroke="#FFB74D" stroke-width="3" fill="none" opacity="0.85">
    <path d="M 60 300 H 180 V 220 H 280"/>
    <path d="M 280 220 H 340"/>
    <path d="M 60 260 H 140 V 180 H 240 V 140"/>
    <path d="M 240 140 H 340"/>
  </g>
  <g fill="#FFB74D">
    <circle cx="60" cy="300" r="6"/>
    <circle cx="180" cy="220" r="6"/>
    <circle cx="60" cy="260" r="6"/>
    <circle cx="240" cy="140" r="6"/>
  </g>
  <!-- IC / chip block the traces feed into -->
  <rect x="340" y="120" width="90" height="140" rx="6" fill="none" stroke="#4FC3F7" stroke-width="3"/>
  <line x1="340" y1="150" x2="325" y2="150" stroke="#4FC3F7" stroke-width="3"/>
  <line x1="340" y1="230" x2="325" y2="230" stroke="#4FC3F7" stroke-width="3"/>
  <line x1="430" y1="150" x2="445" y2="150" stroke="#4FC3F7" stroke-width="3"/>
  <line x1="430" y1="230" x2="445" y2="230" stroke="#4FC3F7" stroke-width="3"/>

  <!-- text block -->
  <text x="490" y="175" font-family="'JetBrains Mono','Courier New',monospace" font-size="46" font-weight="700" fill="#FFB74D">RAHUL SAHU</text>
  <text x="490" y="212" font-family="'JetBrains Mono','Courier New',monospace" font-size="19" fill="#B8D4E8">ELECTRICAL &amp; ELECTRONICS ENGINEER</text>
  <text x="490" y="238" font-family="'JetBrains Mono','Courier New',monospace" font-size="19" fill="#B8D4E8">EMBEDDED SYSTEMS · IoT · POWER SYSTEMS</text>

  <!-- torii gate motif, right side, nods to Japan target -->
  <g stroke="#4FC3F7" stroke-width="6" fill="none" opacity="0.9">
    <line x1="1230" y1="130" x2="1230" y2="290"/>
    <line x1="1380" y1="130" x2="1380" y2="290"/>
    <line x1="1210" y1="130" x2="1400" y2="130"/>
    <line x1="1195" y1="105" x2="1415" y2="105"/>
    <line x1="1245" y1="170" x2="1365" y2="170"/>
  </g>

  <!-- baseline rule -->
  <line x1="60" y1="320" x2="1440" y2="320" stroke="#16324a" stroke-width="2"/>
</svg>
