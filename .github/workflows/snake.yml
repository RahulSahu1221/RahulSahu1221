# .github/workflows/snake.yml
#
# What this does:
#   Once a day (and any time you push to this repo), it reads your public
#   GitHub contribution graph and renders a "snake eating the squares"
#   animation as an SVG file. It then pushes that SVG to a branch called
#   "output" in this same repo. The README embeds it from that branch, so
#   the animation refreshes automatically — you never touch this again
#   after the first setup.
#
# You do NOT need this workflow for the stats cards, streak stats, top
# languages, activity graph, or trophies in the README — those are all
# live images fetched from third-party APIs and update on every page
# load by themselves. This workflow is ONLY for the snake.

name: Generate Snake Animation

# Run automatically every day at 02:00 UTC, and also whenever you push
# to the main branch (so you can test it immediately after setup).
on:
  schedule:
    - cron: "0 2 * * *"
  push:
    branches:
      - main
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # needed so the action can push the SVG back to this repo
    steps:
      # Step 1: run the community "github-contribution-grid-snake" action.
      # It builds the SVG for you — no code to write.
      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: RahulSahu1221
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step 2: push the generated SVG(s) to a branch called "output".
      # This keeps generated files out of your main branch history.
      - name: Push generated SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
